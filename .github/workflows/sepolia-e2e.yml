name: sepolia e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: sepolia-shadow-account-writes
  cancel-in-progress: false

jobs:
  live:
    if: ${{ vars.ENABLE_SEPOLIA_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm shadow:doctor
        env:
          ACCOUNT_ADDRESS: ${{ secrets.SEPOLIA_ACCOUNT_ADDRESS }}
          ACCOUNT_PRIVATE_KEY: ${{ secrets.SEPOLIA_ACCOUNT_PRIVATE_KEY }}
          VIEWING_KEY: ${{ secrets.SEPOLIA_VIEWING_KEY }}
          STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
          AVNU_PAYMASTER_API_KEY: ${{ secrets.AVNU_PAYMASTER_API_KEY }}
      - run: pnpm shadow:demo --recipient "$SEPOLIA_RECIPIENT_ADDRESS"
        env:
          ACCOUNT_ADDRESS: ${{ secrets.SEPOLIA_ACCOUNT_ADDRESS }}
          ACCOUNT_PRIVATE_KEY: ${{ secrets.SEPOLIA_ACCOUNT_PRIVATE_KEY }}
          VIEWING_KEY: ${{ secrets.SEPOLIA_VIEWING_KEY }}
          SEPOLIA_RECIPIENT_ADDRESS: ${{ secrets.SEPOLIA_RECIPIENT_ADDRESS }}
          STARKSCAN_API_KEY: ${{ secrets.STARKSCAN_API_KEY }}
          AVNU_PAYMASTER_API_KEY: ${{ secrets.AVNU_PAYMASTER_API_KEY }}
