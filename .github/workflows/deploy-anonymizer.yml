name: deploy finalized anonymizer

on:
  workflow_dispatch:
    inputs:
      anonymizer_address:
        description: Existing deployment to finalize after an interrupted run (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-finalized-anonymizer-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm anonymizer:deploy
        env:
          ACCOUNT_ADDRESS: ${{ secrets.SEPOLIA_ACCOUNT_ADDRESS }}
          ACCOUNT_PRIVATE_KEY: ${{ secrets.SEPOLIA_ACCOUNT_PRIVATE_KEY }}
          ANONYMIZER_ADDRESS: ${{ inputs.anonymizer_address }}
