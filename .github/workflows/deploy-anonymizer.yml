name: deploy finalized anonymizer

on:
  workflow_dispatch:
    inputs:
      anonymizer_address:
        description: Existing deployment to finalize after an interrupted run (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-finalized-anonymizer-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm anonymizer:deploy
        env:
          ACCOUNT_ADDRESS: ${{ secrets.SEPOLIA_ACCOUNT_ADDRESS }}
          ACCOUNT_PRIVATE_KEY: ${{ secrets.SEPOLIA_ACCOUNT_PRIVATE_KEY }}
          ANONYMIZER_ADDRESS: ${{ inputs.anonymizer_address }}
